# ==============================================================================
# CAU HINH COPYPARTY - SERVER TRUYEN PHAT VIDEO CHO TEAM
# Du an: Download-Video-Team
# ==============================================================================

[global]
  # Cong lang nghe (Port 3923 la mac dinh cua Copyparty, mo them 8080 de de nho)
  p: 3923, 8080

  # Bat tinh nang danh muc file sieu toc va quet he thong tap tin
  e2dsa

  # Bat danh muc thong tin da phuong tien (do phan giai, thoi luong video, audio codec)
  e2ts

  # QUAN TRONG: Tat tinh nang tinh toan SHA hash tren toan bo file (regex . khop tat ca file)
  # Giup chong nghen dia (HDD thrashing) khi thu muc co hang tram GB/TB video
  no-hash: .

  # Bat che do toc do cao
  turbo: 2

  # Gioi han dung luong khi tai ve dang ZIP (toi da 2GB mot lan nen de tranh tran RAM)
  zipmaxs: 2g

  # Kich thuoc thumbnail video chuan ti le 16:9
  th-size: 320x180
  th-ff-jpg

  # Giao dien mac dinh: Hien thi dang Grid kem Thumbnail dep mat
  grid

  # Ten he thong hien thi o goc tren trinh duyet
  name: Kho Video Team (Internal)

  # Tu dong sap xep theo ten file tu nhien (1, 2, 10 thay vi 1, 10, 2)
  nsort

# ==============================================================================
# DANH SACH TAI KHOAN TRUY CAP
# Cu phap: username: password
# ==============================================================================
[accounts]
  # Tai khoan quan tri vien (co quyen them/xoa/sua file)
  admin: Admin@VideoTeam2026

  # Tai khoan thanh vien team (chi co quyen xem va tai video)
  member: TeamVideoPass@123

# ==============================================================================
# CAU HINH THU MUC CHIA SE (VOLUMES)
# Mac dinh chia se thu muc D:\Videos (hoac C:\Videos tuy may chu)
# ==============================================================================
[/]
  # Duong dan thu muc tren may chu Windows (Sua lai neu kho video o o dia khac)
  D:\Videos

  # Phan quyen:
  # - member: chi duoc doc va tai (r)
  # - admin: toan quyen doc/ghi/xoa (rwmd)
  # - Khach vang lai (chua login): khong xem duoc gi
  accs:
    r: member
    rwmd: admin

  # Cac co bo sung cho thu muc video
  flags:
    # Tu dong phat video tren trinh duyet khi bam chuot
    grid
    # Khong cho phep xoa hoac sua file bang lenh truc tiep ngoai tru admin
    nodupe
